[project]
name = "getting-started-ml"
version = "0.1.0"
description = "機械学習から始めるプログラミング入門（Python 版）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.53.0",
]

# 手元・CI・Nix 環境のどこでも同じ Python（.python-version）を使うため、uv が管理する Python に限定する
[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
source = ["lib"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# 型情報（py.typed・スタブ）を持たないライブラリ
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "seaborn.*", "nbformat.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "tox>=4.0",
    "pandas-stubs>=3.0.5.260914",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "jupyterlab>=4.6.3",
    "nbstripout>=0.9.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.3.0",
    "httpx>=0.28.1",
]
