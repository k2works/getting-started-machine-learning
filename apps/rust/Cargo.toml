[package]
name = "getting-started-ml"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
csv = "1.4"
encoding_rs = "0.8"
linfa = "0.8"
linfa-clustering = "0.8"
linfa-elasticnet = "0.8"
linfa-linear = "0.8"
linfa-logistic = "0.8"
linfa-preprocessing = "0.8"
linfa-reduction = "0.8"
linfa-trees = "0.8"
ndarray = "0.16"
rand = "0.8"
rand_xoshiro = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tower = "0.5"

[lints.clippy]
# 章ごとの実装は読みやすさを優先する。警告は抑えずに直すのが原則
all = { level = "deny", priority = -1 }

[profile.dev]
# 第 14 章の K-means は繰り返しが多く、最適化なしでは実行とテストに数十秒かかる
opt-level = 2
