AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"

# テストのメソッド名に日本語を使うので、ASCII 以外の識別子を許す。
Naming/AsciiIdentifiers:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

# テストのメソッド名は日本語で振る舞いを書くので、snake_case を求めない。
Naming/MethodName:
  Exclude:
    - "test/**/*"

# 機械学習の慣例（特徴量 x・正解ラベル t・y）の 1 文字の名前を許す。
Naming/MethodParameterName:
  AllowedNames: [x, t, y]

# テストは期待する出力をヒアドキュメントでそのまま書くので、メソッドの行数を求めない。
Metrics/MethodLength:
  Exclude:
    - "test/**/*"

# テストは 1 つの振る舞いを 1 つのメソッドに書くので、章のテストのクラスは長くなる。
Metrics/ClassLength:
  Exclude:
    - "test/**/*"

# 改行は LF にそろえる（.gitattributes の apps/ruby/** eol=lf と合わせる）。
Layout/EndOfLine:
  EnforcedStyle: lf
